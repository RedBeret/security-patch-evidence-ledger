name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build sample evidence package
        env:
          PYTHONPATH: src
        run: python -m patchledger.cli build tests/fixtures/valid-ledger.json --output-dir dist
      - name: Verify generated artifacts
        run: test -s dist/security-patch-evidence.md && test -s dist/security-patch-evidence.csv && test -s dist/security-patch-summary.json
